name: Build and Deploy Snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test classes to run (empty = full suite)'
        required: false
        default: ''
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_version: ['8', '11', '17', '21', '25']
        os: ['ubuntu-24.04']
        include:
          - java_version: '8'
            os: 'ubuntu-24.04'
            release_build: 'R'
          - java_version: '8'
            os: 'windows-latest'
            is_windows: 'W'
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Set up JDK
      uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
        server-id: central-snapshots
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD
        # See https://github.com/actions/setup-java/blob/v2/docs/advanced-usage.md#Publishing-using-Apache-Maven
        # gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        # gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
    - name: Build
      shell: bash
      env:
        FILTER: ${{ inputs.test-filter }}
      run: |
        if [ -n "$FILTER" ]; then
          ./mvnw -B -q -ff -ntp verify -DreuseForks=false -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          ./mvnw -B -q -ff -ntp verify -DreuseForks=false
        fi
    - name: Report test results
      if: always()
      shell: bash
      run: |
        PY=$(command -v python3 || command -v python)
        "$PY" - <<'PYEOF'
        import glob, xml.etree.ElementTree as ET
        tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
        for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
            r = ET.parse(f).getroot()
            c = {k: int(r.get(k, 0) or 0) for k in tot}
            for k in tot:
                tot[k] += c[k]
            print("SUITE %s: tests=%d failures=%d errors=%d skipped=%d" % (r.get("name"), c["tests"], c["failures"], c["errors"], c["skipped"]))
            for tc in r.iter("testcase"):
                sk = tc.find("skipped")
                if sk is not None:
                    print("SKIPPED: %s.%s -- reason: %s" % (tc.get("classname"), tc.get("name"), sk.get("message") or (sk.text or "").strip() or "@Disabled (no message)"))
        passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
        print("TOTAL: tests=%d passed=%d failures=%d errors=%d skipped=%d" % (tot["tests"], passed, tot["failures"], tot["errors"], tot["skipped"]))
        PYEOF
    - name: Upload jar
      if: ${{ matrix.release_build }}
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
      with:
        name: jackson-core-jar
        path: target/jackson-core-*[0-9].jar
        if-no-files-found: error
    - name: Extract project Maven version
      id: projectVersion
      # for some reason fails on Windows; we don't need it so skip:
      if: ${{ !matrix.is_windows }}
      run: echo "version=$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -DforceStdout -Dexpression=project.version -q)" >>$GITHUB_OUTPUT
    - name: Verify Android SDK Compatibility
      if: ${{ matrix.release_build }}
      run: ./mvnw -B -q -ff -ntp -DskipTests animal-sniffer:check
    - name: Deploy snapshot
      if: ${{ false && github.event_name != 'pull_request' && matrix.release_build && endsWith(steps.projectVersion.outputs.version, '-SNAPSHOT') }}
      env:
        CI_DEPLOY_USERNAME: ${{ secrets.CENTRAL_DEPLOY_USERNAME }}
        CI_DEPLOY_PASSWORD: ${{ secrets.CENTRAL_DEPLOY_PASSWORD }}
        # MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: ./mvnw -B -q -ff -DskipTests -ntp source:jar deploy
    - name: Generate code coverage
      if: ${{ false && github.event_name != 'pull_request' && matrix.release_build }}
      run: ./mvnw -B -q -ff -ntp test
    - name: Publish code coverage
      if: ${{ false && github.event_name != 'pull_request' && matrix.release_build }}
      uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests

